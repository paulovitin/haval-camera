name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source files
        run: |
          bash -n build.sh
          sh -n gradlew
          python3 - <<'PY'
          import tomllib
          import xml.etree.ElementTree as ET

          with open("gradle/libs.versions.toml", "rb") as source:
              assert tomllib.load(source)["versions"]["okhttp"] == "5.4.0"
          ET.parse("app/src/main/AndroidManifest.xml")
          ET.parse("gradle/verification-metadata.xml")
          PY
